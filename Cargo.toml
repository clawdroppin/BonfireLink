[package]
name = "bonfirelink"
version = "1.0.0"
edition = "2024"
description = "One-click installer, updater and co-op companion for LukeYui's Seamless Co-op mods (Elden Ring, Dark Souls III, Dark Souls II, Dark Souls Remastered, Sekiro) on Windows and Steam Deck"
repository = "https://github.com/clawdroppin/BonfireLink"
license = "MIT"

[[bin]]
name = "BonfireLink"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
flate2 = "1"
hex = "0.4.3"
open = "5.4.5"
pelite = "0.10.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust = "0.6.1"
sha2 = "0.11.1"
sysinfo = "0.39.6"
ureq = "3.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
